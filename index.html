<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Synaxarium</title>
<style>
  :root{
    --ink:#37352F;
    --ink-soft:#6B6A65;
    --ink-faint:#9B9A94;
    --rubric:#96222B;          /* madder red — manuscript rubrication */
    --rule:rgba(55,53,47,0.13);
    --rule-strong:rgba(150,34,43,0.55);
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua","URW Palladio L",Georgia,serif;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --ink:#D8D6D1; --ink-soft:#9B9A94; --ink-faint:#75736E;
      --rubric:#E08B84;
      --rule:rgba(255,255,255,0.13);
      --rule-strong:rgba(224,139,132,0.5);
    }
  }
  html[data-theme="light"]{
    --ink:#37352F; --ink-soft:#6B6A65; --ink-faint:#9B9A94; --rubric:#96222B;
    --rule:rgba(55,53,47,0.13); --rule-strong:rgba(150,34,43,0.55);
  }
  html[data-theme="dark"]{
    --ink:#D8D6D1; --ink-soft:#9B9A94; --ink-faint:#75736E; --rubric:#E08B84;
    --rule:rgba(255,255,255,0.13); --rule-strong:rgba(224,139,132,0.5);
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:transparent; color:var(--ink);
    font-family:var(--sans); font-size:15px; line-height:1.5;
    -webkit-font-smoothing:antialiased; display:flex;
  }
  .block{display:flex; flex-direction:column; width:100%; height:100%; padding:14px 16px 10px; min-height:0}

  /* ── masthead ─────────────────────────────── */
  .masthead{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap}
  .eyebrow{
    font-size:9.5px; letter-spacing:.18em; text-transform:uppercase;
    color:var(--ink-faint); font-weight:600; white-space:nowrap;
  }
  .coptic{font-family:var(--serif); font-size:23px; line-height:1.1; letter-spacing:-.01em; font-weight:400}
  .am{font-size:10px; letter-spacing:.1em; color:var(--rubric); font-weight:600; text-transform:uppercase; white-space:nowrap}
  .gregorian{margin:3px 0 0; font-size:11.5px; color:var(--ink-soft); letter-spacing:.02em}
  .divider{
    height:1px; margin:11px 0 13px; flex:none;
    background:linear-gradient(to right,var(--rule-strong) 0 34px,var(--rule) 34px);
  }

  /* ── entry ────────────────────────────────── */
  .scroller{
    flex:1 1 auto; min-height:0; overflow-y:auto; overscroll-behavior:contain;
    padding-left:13px; border-left:1px solid var(--rule);
    scrollbar-width:thin; scrollbar-color:var(--rule) transparent;
    mask-image:linear-gradient(to bottom,#000 calc(100% - 26px),transparent 100%);
    -webkit-mask-image:linear-gradient(to bottom,#000 calc(100% - 26px),transparent 100%);
  }
  .scroller.at-end{mask-image:none; -webkit-mask-image:none}
  .scroller::-webkit-scrollbar{width:5px}
  .scroller::-webkit-scrollbar-thumb{background:var(--rule); border-radius:3px}

  .feast{font-family:var(--serif); color:var(--rubric); font-size:15px; line-height:1.35; margin:0; font-weight:500}
  .feast + .feast{margin-top:5px}
  .feasts:not(:empty){margin-bottom:11px}

  .body{font-family:var(--serif); font-size:14.5px; line-height:1.62}
  .body p{margin:0 0 .8em}
  .body p:last-child{margin-bottom:0}
  .body ul,.body ol{margin:0 0 .8em; padding-left:1.15em}
  .body h1,.body h2,.body h3,.body h4{font-size:14.5px; font-weight:600; color:var(--rubric); margin:0 0 .4em}

  .state{font-family:var(--serif); font-size:14px; color:var(--ink-soft); font-style:italic; margin:0}
  .skeleton span{
    display:block; height:9px; border-radius:2px; background:var(--rule);
    margin-bottom:9px; animation:pulse 1.5s ease-in-out infinite;
  }
  .skeleton span:nth-child(2){width:92%; animation-delay:.12s}
  .skeleton span:nth-child(3){width:78%; animation-delay:.24s}
  @keyframes pulse{0%,100%{opacity:.45}50%{opacity:.9}}

  /* ── controls ─────────────────────────────── */
  .controls{
    flex:none; display:flex; align-items:center; gap:4px;
    padding-top:9px; margin-top:9px; border-top:1px solid var(--rule);
  }
  button{
    font-family:var(--sans); font-size:11px; letter-spacing:.06em;
    color:var(--ink-soft); background:none; border:0; border-radius:4px;
    padding:4px 7px; cursor:pointer; transition:background .12s,color .12s;
  }
  button:hover{background:var(--rule); color:var(--ink)}
  button:focus-visible{outline:2px solid var(--rubric); outline-offset:1px}
  .arrow{font-size:14px; line-height:1; padding:3px 8px}
  .today{text-transform:uppercase; font-weight:600}
  .today[hidden]{display:none}
  .spacer{flex:1}
  .credit{font-size:9.5px; letter-spacing:.05em; color:var(--ink-faint); text-decoration:none; padding:4px 2px}
  .credit:hover{color:var(--ink-soft); text-decoration:underline}

  @media (prefers-reduced-motion: reduce){*{animation:none !important; transition:none !important}}
  @media (max-width:340px){.coptic{font-size:20px} .block{padding:12px}}
</style>
</head>
<body>
<div class="block">
  <header class="masthead">
    <span class="eyebrow">Synaxarium</span>
    <span class="coptic" id="coptic">&nbsp;</span>
    <span class="am" id="am"></span>
  </header>
  <p class="gregorian" id="gregorian"></p>
  <div class="divider"></div>

  <div class="scroller" id="scroller">
    <div class="feasts" id="feasts"></div>
    <div class="body" id="body">
      <div class="skeleton" aria-hidden="true"><span></span><span></span><span></span></div>
    </div>
  </div>

  <nav class="controls">
    <button class="arrow" id="prev" title="Previous day" aria-label="Previous day">&lsaquo;</button>
    <button class="arrow" id="next" title="Next day" aria-label="Next day">&rsaquo;</button>
    <button class="today" id="today" hidden>Today</button>
    <span class="spacer"></span>
    <a class="credit" href="https://github.com/randogoth/coptic-synaxarium" target="_blank" rel="noopener">Source</a>
  </nav>
</div>

<script>
(function(){
  "use strict";

  /* Per-day readings live in ./data/{day}-{Month}.json next to this file.
     If that folder isn't there, the block falls back to the full-year file on GitHub. */
  var DATA_DIR = "data/";
  var FALLBACK = "https://raw.githubusercontent.com/jeninh/synaxarium-api/main/synaxarium.json";

  var MONTHS = ["Tout","Baba","Hator","Kiahk","Toba","Amshir","Baramhat",
                "Baramouda","Bashans","Paona","Epep","Mesra","Nasie"];

  var el = {
    coptic: document.getElementById("coptic"),
    am: document.getElementById("am"),
    gregorian: document.getElementById("gregorian"),
    feasts: document.getElementById("feasts"),
    body: document.getElementById("body"),
    scroller: document.getElementById("scroller"),
    prev: document.getElementById("prev"),
    next: document.getElementById("next"),
    today: document.getElementById("today")
  };

  /* ?theme=light | ?theme=dark — otherwise follows the OS setting */
  var theme = new URLSearchParams(location.search).get("theme");
  if (theme === "light" || theme === "dark") document.documentElement.setAttribute("data-theme", theme);

  /* ── Gregorian → Coptic ──────────────────────────────
     Coptic epoch (1 Tout, A.M. 1) = JDN 1825030, i.e. 29 Aug 284 AD Julian.
     Forward:  jdn = 1825029 + 365*(y-1) + floor(y/4) + 30*(m-1) + d
     Leap years are y % 4 == 3, giving Nasie a sixth day. */
  function gregorianToJDN(y, m, d){
    var a = Math.floor((14 - m) / 12), yy = y + 4800 - a, mm = m + 12 * a - 3;
    return d + Math.floor((153 * mm + 2) / 5) + 365 * yy
             + Math.floor(yy / 4) - Math.floor(yy / 100) + Math.floor(yy / 400) - 32045;
  }
  function toCoptic(date){
    var t = gregorianToJDN(date.getFullYear(), date.getMonth() + 1, date.getDate()) - 1825030;
    var y = Math.floor(t / 365) + 1;
    while (365 * (y - 1) + Math.floor(y / 4) > t) y--;      // walk back over accumulated leap days
    var doy = t - (365 * (y - 1) + Math.floor(y / 4));      // 0-based day of the Coptic year
    var month = Math.floor(doy / 30) + 1;
    return { day: doy % 30 + 1, month: month, monthString: MONTHS[month - 1] || "Nasie", year: y };
  }

  var pad = function(n){ return (n < 10 ? "0" : "") + n; };
  var iso = function(d){ return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()); };
  var startOfToday = function(){ var n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); };
  var keyOf = function(c){ return c.day + " " + c.monthString; };

  /* ── keep only the tags the Synaxarium prose actually uses ── */
  var ALLOWED = {P:1,BR:1,B:1,STRONG:1,I:1,EM:1,U:1,UL:1,OL:1,LI:1,H1:1,H2:1,H3:1,H4:1,BLOCKQUOTE:1,SPAN:1,DIV:1};
  function clean(html){
    var host = document.createElement("div");
    host.innerHTML = String(html || "");
    (function walk(node){
      var kids = Array.prototype.slice.call(node.children);
      for (var i = 0; i < kids.length; i++){
        var c = kids[i];
        if (!ALLOWED[c.tagName]){ c.replaceWith.apply(c, Array.prototype.slice.call(c.childNodes)); continue; }
        while (c.attributes.length) c.removeAttribute(c.attributes[0].name);
        walk(c);
      }
    })(host);
    return host.innerHTML;
  }

  /* ── loading ── */
  var wholeYear = null;
  function loadEntry(coptic){
    var file = DATA_DIR + coptic.day + "-" + coptic.monthString + ".json";
    return fetch(file)
      .then(function(r){ if (!r.ok) throw new Error(r.status); return r.json(); })
      .catch(function(){
        var load = wholeYear ? Promise.resolve(wholeYear)
          : fetch(FALLBACK).then(function(r){ if (!r.ok) throw new Error(r.status); return r.json(); })
                           .then(function(j){ wholeYear = j; return j; });
        return load.then(function(all){ return all[keyOf(coptic)] || null; });
      });
  }

  /* ── rendering ── */
  var current = startOfToday();
  var token = 0;

  function checkEnd(){
    var s = el.scroller;
    s.classList.toggle("at-end", s.scrollHeight - s.clientHeight - s.scrollTop < 8);
  }

  function renderEntry(entry){
    var feasts = (entry && entry.feasts) || [];
    el.feasts.innerHTML = feasts.map(function(f){ return '<p class="feast">' + clean(f) + "</p>"; }).join("");
    el.body.innerHTML = (entry && entry.description)
      ? clean(entry.description)
      : '<p class="state">No reading is recorded for this day. Use the arrows to read a neighbouring day.</p>';
    el.scroller.scrollTop = 0;
    checkEnd();
  }

  function render(){
    var mine = ++token;
    var c = toCoptic(current);

    el.coptic.textContent = c.day + " " + c.monthString;
    el.am.textContent = "A.M. " + c.year;
    el.gregorian.textContent = current.toLocaleDateString(undefined,
      { weekday:"long", month:"long", day:"numeric", year:"numeric" });
    el.today.hidden = (iso(current) === iso(startOfToday()));
    el.feasts.innerHTML = "";
    el.body.innerHTML = '<div class="skeleton" aria-hidden="true"><span></span><span></span><span></span></div>';

    loadEntry(c).then(
      function(entry){ if (mine === token) renderEntry(entry); },
      function(){
        if (mine !== token) return;
        el.feasts.innerHTML = "";
        el.body.innerHTML = '<p class="state">The reading could not be loaded. Check your connection and reload.</p>';
      }
    );
  }

  function shift(days){
    current = new Date(current.getFullYear(), current.getMonth(), current.getDate() + days);
    render();
  }

  el.prev.addEventListener("click", function(){ shift(-1); });
  el.next.addEventListener("click", function(){ shift(1); });
  el.today.addEventListener("click", function(){ current = startOfToday(); render(); });
  el.scroller.addEventListener("scroll", checkEnd, { passive:true });
  window.addEventListener("resize", checkEnd);
  document.addEventListener("keydown", function(e){
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === "ArrowLeft"){ shift(-1); e.preventDefault(); }
    if (e.key === "ArrowRight"){ shift(1); e.preventDefault(); }
  });

  /* roll over to the new day if the page is left open overnight */
  setInterval(function(){
    if (el.today.hidden && iso(current) !== iso(startOfToday())){ current = startOfToday(); render(); }
  }, 60000);

  render();
})();
</script>
</body>
</html>
