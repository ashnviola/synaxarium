<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Synaxarium</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gentium+Book+Plus:ital,wght@0,400;0,700;1,400&family=Barlow+Semi+Condensed:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --indigo-deep:#141D28;
    --indigo-panel:#1B2634;
    --linen:#EDE4D0;
    --linen-dim:#A7A08E;
    --madder:#B8483C;
    --ochre:#C89A3C;
    --rule:rgba(200,154,60,.32);

    --serif:"Gentium Book Plus","Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    --util:"Barlow Semi Condensed","Avenir Next Condensed","Helvetica Neue",Arial,sans-serif;
  }

  *{box-sizing:border-box;}

  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(120% 90% at 50% 0%, #1D2A3A 0%, var(--indigo-deep) 62%, #0E151E 100%);
    color:var(--linen);
    font-family:var(--serif);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:18px 14px;
    -webkit-font-smoothing:antialiased;
  }

  .panel{
    position:relative;
    display:flex;
    flex-direction:column;
    width:min(560px,100%);
    height:100%;
    min-height:0;
    background:linear-gradient(180deg, rgba(255,255,255,.028), rgba(0,0,0,.06));
    border:1px solid var(--rule);
    padding:26px 30px 0;
    overflow:hidden;
  }
  /* inner hairline, like a ruled manuscript frame */
  .panel::before{
    content:"";
    position:absolute;
    inset:6px;
    border:1px solid rgba(237,228,208,.10);
    pointer-events:none;
    z-index:2;
  }

  /* ── header ─────────────────────────────────────── */
  .crest{
    display:block;
    margin:0 auto 14px;
    width:22px;height:22px;
    color:var(--ochre);
    opacity:.9;
    flex:none;
  }

  .eyebrow{
    font-family:var(--util);
    font-size:11px;
    font-weight:600;
    letter-spacing:.22em;
    text-transform:uppercase;
    text-align:center;
    color:var(--linen-dim);
    margin:0 0 20px;
    flex:none;
  }
  .eyebrow .sep{color:var(--rule);margin:0 .55em;}
  .eyebrow .mark{color:var(--ochre);}

  /* ── date ───────────────────────────────────────── */
  .coptic{
    font-size:clamp(23px,3.9vw,30px);
    font-weight:400;
    line-height:1.18;
    margin:0;
    flex:none;
    transition:opacity .5s ease;
  }
  .coptic.fading{opacity:0;}

  .ref{
    font-family:var(--util);
    font-size:12px;
    font-weight:600;
    letter-spacing:.2em;
    text-transform:uppercase;
    color:var(--madder);
    margin:13px 0 20px;
    display:flex;
    align-items:center;
    gap:14px;
    flex:none;
    transition:opacity .5s ease;
  }
  .ref.fading{opacity:0;}
  .ref::after{
    content:"";
    flex:1;
    height:1px;
    background:var(--rule);
  }

  /* ── reading ────────────────────────────────────── */
  .scroller{
    flex:1 1 auto;
    min-height:0;
    overflow-y:auto;
    overscroll-behavior:contain;
    padding-right:12px;
    transition:opacity .5s ease;
    scrollbar-width:thin;
    scrollbar-color:var(--rule) transparent;
    mask-image:linear-gradient(to bottom,#000 calc(100% - 30px),transparent 100%);
    -webkit-mask-image:linear-gradient(to bottom,#000 calc(100% - 30px),transparent 100%);
  }
  .scroller.fading{opacity:0;}
  .scroller.at-end{mask-image:none;-webkit-mask-image:none;}
  .scroller::-webkit-scrollbar{width:4px;}
  .scroller::-webkit-scrollbar-thumb{background:var(--rule);}
  .scroller::-webkit-scrollbar-track{background:transparent;}

  .feast{
    font-size:17px;
    line-height:1.4;
    color:var(--madder);
    margin:0;
  }
  .feast + .feast{margin-top:6px;}
  .feasts:not(:empty){margin-bottom:16px;}

  .reading{
    font-size:16px;
    line-height:1.64;
    color:var(--linen);
  }
  .reading p{margin:0 0 .85em;}
  .reading p:last-child{margin-bottom:0;}
  .reading ul,.reading ol{margin:0 0 .85em;padding-left:1.2em;}
  .reading h1,.reading h2,.reading h3,.reading h4{
    font-size:16px;font-weight:700;color:var(--madder);margin:0 0 .45em;
  }
  /* illuminated initial, matching the verse block's drop cap */
  .reading > p:first-of-type::first-letter{
    float:left;
    font-size:3.05em;
    line-height:.86;
    padding:.06em .16em 0 0;
    color:var(--madder);
    font-weight:700;
  }
  .reading > p.state::first-letter{
    float:none;font-size:inherit;line-height:inherit;
    padding:0;color:inherit;font-weight:inherit;
  }
  .state{
    font-style:italic;
    color:var(--linen-dim);
    margin:0;
  }

  /* ── controls ───────────────────────────────────── */
  .bar{
    display:flex;
    align-items:center;
    gap:6px;
    margin:18px -30px 0;
    padding:0 24px;
    border-top:1px solid var(--rule);
    flex:none;
  }
  button{
    appearance:none;
    background:none;
    border:0;
    color:var(--linen-dim);
    font-family:var(--util);
    font-size:11px;
    font-weight:600;
    letter-spacing:.18em;
    text-transform:uppercase;
    padding:14px 10px;
    cursor:pointer;
    transition:color .2s ease;
  }
  button:hover{color:var(--ochre);}
  button:focus-visible{
    outline:1px solid var(--ochre);
    outline-offset:-4px;
    color:var(--ochre);
  }
  button[hidden]{display:none;}
  .spacer{flex:1;}
  .status{
    font-family:var(--util);
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--ochre);
    padding-right:10px;
    opacity:0;
    transition:opacity .3s ease;
    white-space:nowrap;
  }
  .status.show{opacity:1;}

  @media (prefers-reduced-motion:reduce){
    .coptic,.ref,.scroller,.status{transition:none;}
  }
  @media (max-width:420px){
    body{padding:12px 10px;}
    .panel{padding:22px 20px 0;}
    .bar{margin:16px -20px 0;padding:0 12px;}
    button{padding:13px 7px;letter-spacing:.12em;}
  }
</style>
</head>
<body>

<main class="panel">
  <svg class="crest" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.4">
    <path d="M12 2.5v19M2.5 12h19"/>
    <circle cx="12" cy="12" r="3.1"/>
  </svg>

  <p class="eyebrow">
    <span class="mark">Synaxarium</span>
    <span class="sep">·</span>
    <span id="gregorian"></span>
  </p>

  <h1 class="coptic" id="coptic">&nbsp;</h1>
  <p class="ref"><span id="am"></span></p>

  <div class="scroller" id="scroller">
    <div class="feasts" id="feasts"></div>
    <div class="reading" id="reading"></div>
  </div>

  <div class="bar">
    <button id="prev" type="button">Previous</button>
    <button id="next" type="button">Next</button>
    <button id="today-btn" type="button" hidden>Today</button>
    <button id="copy" type="button">Copy</button>
    <span class="spacer"></span>
    <span class="status" id="status" role="status"></span>
  </div>
</main>

<script>
(function(){
  "use strict";

  /* Per-day readings live in ./data/{day}-{Month}.json next to this file.
     If that folder is missing, the block falls back to the full-year file on GitHub. */
  var DATA_DIR = "data/";
  var FALLBACK = "https://raw.githubusercontent.com/jeninh/synaxarium-api/main/synaxarium.json";

  var MONTHS = ["Tout","Baba","Hator","Kiahk","Toba","Amshir","Baramhat",
                "Baramouda","Bashans","Paona","Epep","Mesra","Nasie"];

  var $coptic    = document.getElementById("coptic");
  var $am        = document.getElementById("am");
  var $gregorian = document.getElementById("gregorian");
  var $feasts    = document.getElementById("feasts");
  var $reading   = document.getElementById("reading");
  var $scroller  = document.getElementById("scroller");
  var $ref       = document.querySelector(".ref");
  var $prev      = document.getElementById("prev");
  var $next      = document.getElementById("next");
  var $todayBtn  = document.getElementById("today-btn");
  var $copy      = document.getElementById("copy");
  var $status    = document.getElementById("status");

  /* ── Gregorian → Coptic ──────────────────────────────
     Coptic epoch (1 Tout, A.M. 1) = JDN 1825030, i.e. 29 Aug 284 AD Julian.
     Forward:  jdn = 1825029 + 365*(y-1) + floor(y/4) + 30*(m-1) + d
     Leap years are y % 4 == 3, which gives Nasie a sixth day. */
  function gregorianToJDN(y, m, d){
    var a = Math.floor((14 - m) / 12), yy = y + 4800 - a, mm = m + 12 * a - 3;
    return d + Math.floor((153 * mm + 2) / 5) + 365 * yy
             + Math.floor(yy / 4) - Math.floor(yy / 100) + Math.floor(yy / 400) - 32045;
  }
  function toCoptic(date){
    var t = gregorianToJDN(date.getFullYear(), date.getMonth() + 1, date.getDate()) - 1825030;
    var y = Math.floor(t / 365) + 1;
    while (365 * (y - 1) + Math.floor(y / 4) > t) y--;   // walk back over accumulated leap days
    var doy = t - (365 * (y - 1) + Math.floor(y / 4));   // 0-based day of the Coptic year
    var month = Math.floor(doy / 30) + 1;
    return { day: doy % 30 + 1, month: month, monthString: MONTHS[month - 1] || "Nasie", year: y };
  }

  var pad   = function(n){ return (n < 10 ? "0" : "") + n; };
  var iso   = function(d){ return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()); };
  var today = function(){ var n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); };
  var keyOf = function(c){ return c.day + " " + c.monthString; };

  /* ── keep only the tags the Synaxarium prose actually uses ── */
  var ALLOWED = {P:1,BR:1,B:1,STRONG:1,I:1,EM:1,U:1,UL:1,OL:1,LI:1,H1:1,H2:1,H3:1,H4:1,BLOCKQUOTE:1,SPAN:1,DIV:1};
  function clean(html){
    var host = document.createElement("div");
    host.innerHTML = String(html || "");
    (function walk(node){
      var kids = Array.prototype.slice.call(node.children);
      for (var i = 0; i < kids.length; i++){
        var c = kids[i];
        if (!ALLOWED[c.tagName]){ c.replaceWith.apply(c, Array.prototype.slice.call(c.childNodes)); continue; }
        while (c.attributes.length) c.removeAttribute(c.attributes[0].name);
        walk(c);
      }
    })(host);
    return host.innerHTML;
  }

  /* ── loading ── */
  var wholeYear = null;
  function loadEntry(coptic){
    return fetch(DATA_DIR + coptic.day + "-" + coptic.monthString + ".json")
      .then(function(r){ if (!r.ok) throw new Error(r.status); return r.json(); })
      .catch(function(){
        var load = wholeYear ? Promise.resolve(wholeYear)
          : fetch(FALLBACK).then(function(r){ if (!r.ok) throw new Error(r.status); return r.json(); })
                           .then(function(j){ wholeYear = j; return j; });
        return load.then(function(all){ return all[keyOf(coptic)] || null; });
      });
  }

  /* ── rendering ── */
  var current = today();
  var token = 0;

  function fade(on){
    [$coptic, $ref, $scroller].forEach(function(n){ n.classList.toggle("fading", on); });
  }
  function checkEnd(){
    $scroller.classList.toggle("at-end",
      $scroller.scrollHeight - $scroller.clientHeight - $scroller.scrollTop < 8);
  }
  function flash(msg){
    $status.textContent = msg;
    $status.classList.add("show");
    clearTimeout(flash.t);
    flash.t = setTimeout(function(){ $status.classList.remove("show"); }, 1800);
  }

  function paint(coptic, entry){
    $coptic.textContent = coptic.day + " " + coptic.monthString;
    $am.textContent = "A.M. " + coptic.year;
    $gregorian.textContent = current.toLocaleDateString(undefined,
      { weekday:"long", month:"long", day:"numeric", year:"numeric" });
    $todayBtn.hidden = (iso(current) === iso(today()));

    var feasts = (entry && entry.feasts) || [];
    $feasts.innerHTML = feasts.map(function(f){ return '<p class="feast">' + clean(f) + "</p>"; }).join("");
    $reading.innerHTML = (entry && entry.description)
      ? clean(entry.description)
      : '<p class="state">No reading is recorded for this day. Use Previous or Next to read a neighbouring day.</p>';
    $scroller.scrollTop = 0;
    checkEnd();
  }

  function render(animate){
    var mine = ++token;
    var coptic = toCoptic(current);
    if (animate) fade(true);

    var wait = animate
      ? new Promise(function(r){ setTimeout(r, 240); })
      : Promise.resolve();

    Promise.all([loadEntry(coptic).catch(function(){ return "error"; }), wait])
      .then(function(res){
        if (mine !== token) return;
        if (res[0] === "error"){
          $feasts.innerHTML = "";
          $reading.innerHTML = '<p class="state">The reading could not be loaded. Check your connection and reload.</p>';
          $coptic.textContent = coptic.day + " " + coptic.monthString;
          $am.textContent = "A.M. " + coptic.year;
        } else {
          paint(coptic, res[0]);
        }
        fade(false);
      });
  }

  function shift(days){
    current = new Date(current.getFullYear(), current.getMonth(), current.getDate() + days);
    render(true);
  }

  $prev.addEventListener("click", function(){ shift(-1); });
  $next.addEventListener("click", function(){ shift(1); });
  $todayBtn.addEventListener("click", function(){ current = today(); render(true); });

  $copy.addEventListener("click", function(){
    var lines = [$coptic.textContent + " · " + $am.textContent, $gregorian.textContent, ""];
    Array.prototype.forEach.call($feasts.children, function(p){ lines.push(p.textContent); });
    lines.push("", ($reading.innerText || $reading.textContent || "").trim());
    var text = lines.join("\n");
    var done = function(){ flash("Copied"); };
    var fail = function(){ flash("Copy failed"); };
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(done, fail);
    } else {
      try{
        var ta = document.createElement("textarea");
        ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
        document.body.appendChild(ta); ta.select(); document.execCommand("copy");
        document.body.removeChild(ta); done();
      } catch(e){ fail(); }
    }
  });

  $scroller.addEventListener("scroll", checkEnd, { passive:true });
  window.addEventListener("resize", checkEnd);
  document.addEventListener("keydown", function(e){
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === "ArrowLeft"){ shift(-1); e.preventDefault(); }
    if (e.key === "ArrowRight"){ shift(1); e.preventDefault(); }
  });

  /* roll over to the new day if the page is left open overnight */
  setInterval(function(){
    if ($todayBtn.hidden && iso(current) !== iso(today())){ current = today(); render(true); }
  }, 60000);

  render(false);
})();
</script>
</body>
</html>
